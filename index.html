<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantinho</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
  background-color: #72a3c4; 
  background-image: radial-gradient(#fbcfe8 1.5px, transparent 1.5px); 
  background-size: 20px 20px;
  font-family: 'Segoe UI', cursive, sans-serif;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}

/* --- TELA DE LOGIN --- */
#login-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(224, 242, 254, 0.85); 
  backdrop-filter: blur(12px);
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-card {
  background: #fce7f3; 
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(244, 114, 182, 0.25); 
  width: 90%;
  max-width: 360px;
  text-align: center;
  border: 1px solid #fbcfe8;
}

.login-card h2 {
  margin-bottom: 20px;
  color: #0284c7; 
  font-size: 1.6rem;
}

.login-card input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border: 1px solid #fbcfe8;
  border-radius: 10px;
  font-size: 1rem;
  outline: none;
  background-color: #ffffff;
  color: #334155;
}

.login-card input:focus {
  border-color: #38bdf8;
}

.login-card button {
  width: 100%;
  padding: 12px;
  background: #7dd3fc; 
  color: #0f172a;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

.login-card button:hover {
  background: #38bdf8;
}

.login-error {
  color: #f43f5e;
  font-size: 0.85rem;
  margin-top: 10px;
  display: none;
}

/* --- BARRA DE FERRAMENTAS --- */
#toolbar {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(81, 187, 160, 0.9); 
  backdrop-filter: blur(10px);
  padding: 10px 20px;
  border-radius: 30px;
  box-shadow: 0 8px 20px rgba(186, 230, 253, 0.4);
  display: flex;
  gap: 10px;
  z-index: 1000;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  border: 1px solid #bae6fd;
}

.user-badge {
  font-weight: bold;
  color: #0284c7;
  padding: 6px 12px;
  background: #e0f2fe;
  border-radius: 15px;
  font-size: 0.85rem;
  margin-right: 5px;
}

.btn {
  background: #bae6fd; 
  color: #0369a1;
  border: none;
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  transition: background 0.2s, transform 0.1s;
}

.btn:hover {
  background: #7dd3fc;
  transform: scale(1.05);
}

.btn.active {
  background: #fbcfe8; 
  color: #be185d;
}

.btn-special {
  background: linear-gradient(135deg, #fbcfe8, #f472b6); 
  color: #831843;
  box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3);
}

    /* --- CANVAS & QUADRO --- */
    #board {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    #draw-canvas.drawing-active {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* --- CARDS & ELEMENTOS --- */
    .item {
      position: absolute;
      padding: 15px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      cursor: grab;
      min-width: 150px;
      min-height: 100px;
      width: 200px;
    }

    .item:active {
      cursor: grabbing;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    .item.note {
      background: #fef08a;
      color: #713f12;
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }

    .item.note textarea {
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      height: calc(100% - 10px);
      font-family: inherit;
      font-size: 1.05rem;
      color: inherit;
    }

    .item.photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      pointer-events: none;
      display: block;
    }

    .item.audio audio {
      width: 100%;
      outline: none;
    }

    /* Botão Excluir & Alça de Redimensionamento */
    .delete-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      cursor: pointer;
      display: none;
      z-index: 10;
    }

    .resize-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      right: 2px;
      bottom: 2px;
      background: #8b5cf6;
      border-radius: 50%;
      cursor: se-resize;
      display: none;
      z-index: 10;
    }

    .item:hover .delete-btn,
    .item:hover .resize-handle {
      display: block;
    }

    /* --- ANIMAÇÃO CHUVA DE EMOJIS --- */
    .emoji-rain {
      position: fixed;
      top: -50px;
      font-size: 2rem;
      pointer-events: none;
      z-index: 999;
      animation: fall 3.5s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Tela de Login -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>Nosso Cantinho</h2>
      <input type="text" id="login-user" placeholder="Usuário">
      <input type="password" id="login-pass" placeholder="Senha">
      <button onclick="checkLogin()">Entrar</button>
      <div class="login-error" id="login-error">Usuário ou senha incorretos!</div>
    </div>
  </div>

  <!-- Barra de Ferramentas -->
  <div id="toolbar" style="display: none;">
    <span class="user-badge" id="user-display">Usuário</span>
    <button class="btn" onclick="addNote()">+ Nota</button>
    <button class="btn" onclick="triggerFileInput('image')">+ Foto</button>
    <button class="btn" onclick="triggerFileInput('audio')">+ Músicas/Áudio</button>
    <button class="btn" id="draw-toggle" onclick="setMode('draw')">🎨 Desenhar</button>
    <button class="btn" id="erase-toggle" onclick="setMode('erase')">🧹 Borracha</button>
    <button class="btn btn-special" onclick="sendEmojiRain()">✨ Enviar Emoji</button>
    <button class="btn" style="background:#ef4444" onclick="clearCanvas()">Limpar Tela</button>
    <input type="file" id="file-input" style="display: none;" accept="">
  </div>

  <div id="board"></div>
  <canvas id="draw-canvas"></canvas>

  <!-- Firebase via Módulos CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAerJxRg8JF2W2DLLCLrI7d9pIFNprMQl0",
      authDomain: "chatcat-73364.firebaseapp.com",
      databaseURL: "https://chatcat-73364-default-rtdb.firebaseio.com",
      projectId: "chatcat-73364",
      storageBucket: "chatcat-73364.firebasestorage.app",
      messagingSenderId: "645503800079",
      appId: "1:645503800079:web:850860c42bec8a73e0e47a",
      measurementId: "G-1K6TJ1G44X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const itemsRef = ref(db, 'mural/items');
    const drawingRef = ref(db, 'mural/drawing');
    const emojiRef = ref(db, 'mural/emoji_rain');

    const board = document.getElementById('board');
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('file-input');

    let activeTool = null; // 'draw' ou 'erase'
    let isDrawing = false;
    let activeFileType = null;
    let isSyncingFromRemote = false;
    let isLoggedIn = false;
    let pendingEmoji = null;

    // --- SESSÃO E LOGIN ---
    window.checkLogin = function() {
      const u = document.getElementById('login-user').value.trim();
      const p = document.getElementById('login-pass').value.trim();
      const err = document.getElementById('login-error');

      if (u === "Raposa" && p === "capitao21") {
        loginSuccess("Capitão");
      } else if (u === "Raposinha" && p === "dinos") {
        loginSuccess("Lidia");
      } else {
        err.style.display = "block";
      }
    };

    function loginSuccess(displayName) {
      isLoggedIn = true;
      sessionStorage.setItem('current_user', displayName);
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('toolbar').style.display = 'flex';
      document.getElementById('user-display').innerText = displayName;

      // Se houver algum emoji pendente recebido antes do login, dispara a chuva agora
      if (pendingEmoji) {
        triggerEmojiRain(pendingEmoji);
        pendingEmoji = null;
      }
    }

    // Auto-login se já tiver sessão iniciada
    const savedUser = sessionStorage.getItem('current_user');
    if (savedUser) {
      loginSuccess(savedUser);
    }

    // --- CANVAS & DESENHO / BORRACHA ---
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.setMode = function(mode) {
      const drawBtn = document.getElementById('draw-toggle');
      const eraseBtn = document.getElementById('erase-toggle');

      if (activeTool === mode) {
        activeTool = null;
        canvas.classList.remove('drawing-active');
        drawBtn.classList.remove('active');
        eraseBtn.classList.remove('active');
      } else {
        activeTool = mode;
        canvas.classList.add('drawing-active');
        drawBtn.classList.toggle('active', mode === 'draw');
        eraseBtn.classList.toggle('active', mode === 'erase');
      }
    };

    function getPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function startDrawing(e) {
      if (!activeTool) return;
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing || !activeTool) return;
      e.preventDefault();
      const pos = getPos(e);

      ctx.lineTo(pos.x, pos.y);

      if (activeTool === 'draw') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 4;
      } else if (activeTool === 'erase') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 24;
      }

      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        saveCanvasToFirebase();
      }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    function saveCanvasToFirebase() {
      const dataUrl = canvas.toDataURL();
      set(drawingRef, dataUrl);
    }

    window.clearCanvas = function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      set(drawingRef, null);
    };

    onValue(drawingRef, (snapshot) => {
      const data = snapshot.val();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (data) {
        const img = new Image();
        img.src = data;
        img.onload = () => {
          ctx.globalCompositeOperation = 'source-over';
          ctx.drawImage(img, 0, 0);
        };
      }
    });

    // --- EMOJI RAIN ESPECIAL ---
    window.sendEmojiRain = function() {
      const emoji = prompt("Qual emoji você quer enviar para cair na tela?", "❤️");
      if (emoji && emoji.trim() !== "") {
        set(emojiRef, {
          emoji: emoji.trim(),
          timestamp: Date.now()
        });
      }
    };

    function triggerEmojiRain(emoji) {
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'emoji-rain';
          el.innerText = emoji;
          el.style.left = Math.random() * 95 + 'vw';
          el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
          document.body.appendChild(el);

          setTimeout(() => el.remove(), 4000);
        }, i * 100);
      }
    }

    // Ouvir novos emojis enviados
    let lastEmojiTime = 0;
    onValue(emojiRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.timestamp > lastEmojiTime) {
        lastEmojiTime = data.timestamp;
        if (isLoggedIn) {
          triggerEmojiRain(data.emoji);
        } else {
          pendingEmoji = data.emoji;
        }
      }
    });

    // --- ARRASTAR E REDIMENSIONAR ITENS ---
    function makeInteractive(element) {
      let posX = 0, posY = 0, mouseX = 0, mouseY = 0;

      element.onmousedown = (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON' || 
            e.target.tagName === 'AUDIO' || e.target.classList.contains('resize-handle')) return;
        
        e.preventDefault();
        mouseX = e.clientX;
        mouseY = e.clientY;

        document.onmousemove = (e) => {
          e.preventDefault();
          posX = mouseX - e.clientX;
          posY = mouseY - e.clientY;
          mouseX = e.clientX;
          mouseY = e.clientY;

          element.style.top = (element.offsetTop - posY) + "px";
          element.style.left = (element.offsetLeft - posX) + "px";
        };

        document.onmouseup = () => {
          document.onmousemove = null;
          document.onmouseup = null;
          saveItemsToFirebase();
        };
      };

      const resizeHandle = element.querySelector('.resize-handle');
      if (resizeHandle) {
        resizeHandle.onmousedown = (e) => {
          e.stopPropagation();
          e.preventDefault();
          let startW = element.offsetWidth;
          let startH = element.offsetHeight;
          let startX = e.clientX;
          let startY = e.clientY;

          document.onmousemove = (e) => {
            let newW = startW + (e.clientX - startX);
            let newH = startH + (e.clientY - startY);
            if (newW > 120) element.style.width = newW + 'px';
            if (newH > 80) element.style.height = newH + 'px';
          };

          document.onmouseup = () => {
            document.onmousemove = null;
            document.onmouseup = null;
            saveItemsToFirebase();
          };
        };
      }
    }

    function createBaseItem(type, id, x = 100, y = 100, w = 200, h = 150) {
      const item = document.createElement('div');
      item.className = `item ${type}`;
      item.dataset.id = id;
      item.style.left = x + 'px';
      item.style.top = y + 'px';
      item.style.width = w + 'px';
      item.style.height = h + 'px';

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.innerText = '✕';
      delBtn.onclick = () => {
        item.remove();
        saveItemsToFirebase();
      };
      item.appendChild(delBtn);

      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'resize-handle';
      item.appendChild(resizeHandle);

      makeInteractive(item);
      return item;
    }

    window.addNote = function(text = 'Escreva algo aqui...', id = Date.now().toString(), x = 150, y = 150, w = 200, h = 150) {
      if (document.querySelector(`[data-id="${id}"]`)) return;
      const item = createBaseItem('note', id, x, y, w, h);
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.oninput = saveItemsToFirebase;
      item.appendChild(textarea);
      board.appendChild(item);
      if (!isSyncingFromRemote) saveItemsToFirebase();
    };

    window.triggerFileInput = function(type) {
      activeFileType = type;
      fileInput.accept = type === 'image' ? 'image/*' : 'audio/*';
      fileInput.click();
    };

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const src = event.target.result;
        if (activeFileType === 'image') {
          addPhoto(src);
        } else if (activeFileType === 'audio') {
          addAudio(src);
        }
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    });

    function addPhoto(src, id = Date.now().toString(), x = 200, y = 200, w = 220, h = 180) {
      if (document.querySelector(`[data-id="${id}"]`)) return;
      const item = createBaseItem('photo', id, x, y, w, h);
      const img = document.createElement('img');
      img.src = src;
      item.appendChild(img);
      board.appendChild(item);
      if (!isSyncingFromRemote) saveItemsToFirebase();
    }

    function addAudio(src, id = Date.now().toString(), x = 250, y = 250, w = 250, h = 90) {
      if (document.querySelector(`[data-id="${id}"]`)) return;
      const item = createBaseItem('audio', id, x, y, w, h);
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = src;
      item.appendChild(audio);
      board.appendChild(item);
      if (!isSyncingFromRemote) saveItemsToFirebase();
    }

    // --- SINCRONIZAÇÃO DE ITENS NO FIREBASE ---
    function saveItemsToFirebase() {
      if (isSyncingFromRemote) return;

      const items = [];
      document.querySelectorAll('.item').forEach(el => {
        const type = el.classList.contains('note') ? 'note' :
                     el.classList.contains('photo') ? 'photo' : 'audio';

        const data = {
          id: el.dataset.id,
          type,
          x: parseInt(el.style.left),
          y: parseInt(el.style.top),
          w: parseInt(el.style.width),
          h: parseInt(el.style.height)
        };

        if (type === 'note') data.content = el.querySelector('textarea').value;
        if (type === 'photo') data.content = el.querySelector('img').src;
        if (type === 'audio') data.content = el.querySelector('audio').src;

        items.push(data);
      });

      set(itemsRef, items);
    }

    onValue(itemsRef, (snapshot) => {
      const items = snapshot.val() || [];
      isSyncingFromRemote = true;

      board.innerHTML = '';

      items.forEach(item => {
        if (item.type === 'note') addNote(item.content, item.id, item.x, item.y, item.w, item.h);
        if (item.type === 'photo') addPhoto(item.content, item.id, item.x, item.y, item.w, item.h);
        if (item.type === 'audio') addAudio(item.content, item.id, item.x, item.y, item.w, item.h);
      });

      isSyncingFromRemote = false;
    });
  </script>
</body>
</html>
