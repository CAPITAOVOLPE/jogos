<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Permite zoom livre em telas touch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantinho</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #e0f2fe; /* Azul bebê pastel */
      background-image: radial-gradient(#fbcfe8 1.5px, transparent 1.5px); /* Pontos rosa claro */
      background-size: 20px 20px;
      font-family: 'Segoe UI', cursive, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    /* --- TELA DE LOGIN --- */
    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(224, 242, 254, 0.85); 
      backdrop-filter: blur(12px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background: #fce7f3; /* Rosa bebê pastel */
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(244, 114, 182, 0.25); 
      width: 90%;
      max-width: 360px;
      text-align: center;
      border: 1px solid #fbcfe8;
    }

    .login-card h2 {
      margin-bottom: 20px;
      color: #0284c7; 
      font-size: 1.6rem;
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #fbcfe8;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background-color: #ffffff;
      color: #334155;
    }

    .login-card input:focus {
      border-color: #38bdf8;
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      background: #7dd3fc; 
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-card button:hover {
      background: #38bdf8;
    }

    .login-error {
      color: #f43f5e;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    /* --- BARRA DE FERRAMENTAS --- */
    #toolbar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.92); 
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(186, 230, 253, 0.4);
      display: flex;
      gap: 8px;
      z-index: 1000;
      align-items: center;
      flex-wrap: nowrap;
      justify-content: flex-start;
      border: 1px solid #bae6fd;
      max-width: 95vw;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #toolbar::-webkit-scrollbar {
      display: none;
    }

    .user-badge {
      font-weight: bold;
      color: #0284c7;
      padding: 6px 12px;
      background: #e0f2fe;
      border-radius: 15px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .btn {
      background: #bae6fd; 
      color: #0369a1;
      border: none;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #7dd3fc;
      transform: scale(1.03);
    }

    .btn.active {
      background: #fbcfe8; 
      color: #be185d;
    }

    .btn-special {
      background: linear-gradient(135deg, #fbcfe8, #f472b6); 
      color: #831843;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3);
    }

    /* --- CONTÊINER DE PAN & ZOOM --- */
    #viewport {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      touch-action: none;
    }

    #zoom-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 3000px;
      height: 3000px;
      transform-origin: 0 0;
    }

    /* --- CANVAS & QUADRO --- */
    #board {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      touch-action: none;
    }

    #draw-canvas.drawing-active {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* --- CARDS & ELEMENTOS --- */
    .item {
      position: absolute;
      padding: 12px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      cursor: grab;
      min-width: 140px;
      min-height: 90px;
      width: 190px;
      touch-action: none;
    }

    .item:active {
      cursor: grabbing;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }

    .item.note {
      background: #fef9c3; /* Amarelo/creme pastel */
      color: #713f12;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      border: 1px solid #fef08a;
    }

    .item.note textarea {
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      height: calc(100% - 10px);
      font-family: inherit;
      font-size: 1rem;
      color: inherit;
      user-select: text;
      -webkit-user-select: text;
    }

    .item.photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      pointer-events: none;
      display: block;
    }

    .item.audio audio {
      width: 100%;
      outline: none;
    }

    /* Botão Excluir & Alça de Redimensionamento */
    .delete-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #f43f5e;
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 12px;
      cursor: pointer;
      display: none;
      z-index: 10;
    }

    .resize-handle {
      position: absolute;
      width: 22px;
      height: 22px;
      right: -4px;
      bottom: -4px;
      background: #38bdf8;
      border: 2px solid #ffffff;
      border-radius: 50%;
      cursor: se-resize;
      display: none;
      z-index: 10;
      touch-action: none;
    }

    .item:hover .delete-btn,
    .item:hover .resize-handle,
    .item:focus-within .delete-btn,
    .item:focus-within .resize-handle {
      display: block;
    }

    @media (hover: none) {
      .delete-btn, .resize-handle {
        display: block !important;
      }
    }

    /* --- ANIMAÇÃO CHUVA DE EMOJIS --- */
    .emoji-rain {
      position: fixed;
      top: -50px;
      font-size: 2rem;
      pointer-events: none;
      z-index: 999;
      animation: fall 3.5s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Tela de Login -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>Nosso Cantinho</h2>
      <input type="text" id="login-user" placeholder="Usuário" autocomplete="off">
      <input type="password" id="login-pass" placeholder="Senha">
      <button onclick="checkLogin()">Entrar</button>
      <div class="login-error" id="login-error">Usuário ou senha incorretos!</div>
    </div>
  </div>

  <!-- Barra de Ferramentas -->
  <div id="toolbar" style="display: none;">
    <span class="user-badge" id="user-display">Usuário</span>
    <button class="btn" onclick="addNote()">+ Nota</button>
    <button class="btn" onclick="triggerFileInput('image')">+ Foto</button>
    <button class="btn" onclick="triggerFileInput('audio')">+ Áudio</button>
    <button class="btn" id="draw-toggle" onclick="setMode('draw')">🎨 Desenhar</button>
    <button class="btn" id="erase-toggle" onclick="setMode('erase')">🧹 Borracha</button>
    <button class="btn btn-special" onclick="sendEmojiRain()">✨ Emoji</button>
    <button class="btn" onclick="resetZoom()">🔍 Reset Zoom</button>
    <button class="btn" style="background:#fca5a5; color:#7f1d1d;" onclick="clearCanvas()">Limpar</button>
    <input type="file" id="file-input" style="display: none;" accept="">
  </div>

  <!-- Contêiner Interativo para Zoom e Navegação -->
  <div id="viewport">
    <div id="zoom-container">
      <div id="board"></div>
      <canvas id="draw-canvas"></canvas>
    </div>
  </div>

  <!-- Firebase via Módulos CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAerJxRg8JF2W2DLLCLrI7d9pIFNprMQl0",
      authDomain: "chatcat-73364.firebaseapp.com",
      databaseURL: "https://chatcat-73364-default-rtdb.firebaseio.com",
      projectId: "chatcat-73364",
      storageBucket: "chatcat-73364.firebasestorage.app",
      messagingSenderId: "645503800079",
      appId: "1:645503800079:web:850860c42bec8a73e0e47a",
      measurementId: "G-1K6TJ1G44X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const itemsRef = ref(db, 'mural/items');
    const drawingRef = ref(db, 'mural/drawing');
    const emojiRef = ref(db, 'mural/emoji_rain');

    const viewport = document.getElementById('viewport');
    const zoomContainer = document.getElementById('zoom-container');
    const board = document.getElementById('board');
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('file-input');

    let activeTool = null; // 'draw' ou 'erase'
    let isDrawing = false;
    let activeFileType = null;
    let isSyncingFromRemote = false;
    let isLoggedIn = false;
    let pendingEmoji = null;

    // --- CONTROLE DE PAN & ZOOM ---
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let startDist = 0;
    let startScale = 1;
    let touchStartX = 0;
    let touchStartY = 0;
    let isPanning = false;

    function applyTransform() {
      zoomContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    window.resetZoom = function() {
      scale = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    };

    function getDistance(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    viewport.addEventListener('touchstart', (e) => {
      // Se tiver desenhando ou tocando em um card/item, ignora o pan da tela inteira
      if (e.target.closest('.item') || (activeTool && e.touches.length === 1)) return;

      if (e.touches.length === 2) {
        startDist = getDistance(e.touches[0], e.touches[1]);
        startScale = scale;
      } else if (e.touches.length === 1) {
        isPanning = true;
        touchStartX = e.touches[0].clientX - panX;
        touchStartY = e.touches[0].clientY - panY;
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      if (e.target.closest('.item') || (activeTool && e.touches.length === 1)) return;

      if (e.touches.length === 2) {
        e.preventDefault();
        const dist = getDistance(e.touches[0], e.touches[1]);
        if (startDist > 0) {
          scale = Math.min(Math.max(0.5, startScale * (dist / startDist)), 3);
          applyTransform();
        }
      } else if (e.touches.length === 1 && isPanning) {
        e.preventDefault();
        panX = e.touches[0].clientX - touchStartX;
        panY = e.touches[0].clientY - touchStartY;
        applyTransform();
      }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) startDist = 0;
      if (e.touches.length === 0) isPanning = false;
    });

    // --- SESSÃO E LOGIN ---
    window.checkLogin = function() {
      const u = document.getElementById('login-user').value.trim();
      const p = document.getElementById('login-pass').value.trim();
      const err = document.getElementById('login-error');

      if (u === "Raposa" && p === "capitao21") {
        loginSuccess("Capitão");
      } else if (u === "Raposinha" && p === "dinos") {
        loginSuccess("Lidia");
      } else {
        err.style.display = "block";
      }
    };

    function loginSuccess(displayName) {
      isLoggedIn = true;
      sessionStorage.setItem('current_user', displayName);
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('toolbar').style.display = 'flex';
      document.getElementById('user-display').innerText = displayName;

      if (pendingEmoji) {
        triggerEmojiRain(pendingEmoji);
        pendingEmoji = null;
      }
    }

    const savedUser = sessionStorage.getItem('current_user');
    if (savedUser) {
      loginSuccess(savedUser);
    }

    // --- CANVAS & DESENHO / BORRACHA ---
    function resizeCanvas() {
      canvas.width = 3000;
      canvas.height = 3000;
    }
    resizeCanvas();

    window.setMode = function(mode) {
      const drawBtn = document.getElementById('draw-toggle');
      const eraseBtn = document.getElementById('erase-toggle');

      if (activeTool === mode) {
        activeTool = null;
        canvas.classList.remove('drawing-active');
        drawBtn.classList.remove('active');
        eraseBtn.classList.remove('active');
      } else {
        activeTool = mode;
        canvas.classList.add('drawing-active');
        drawBtn.classList.toggle('active', mode === 'draw');
        eraseBtn.classList.toggle('active', mode === 'erase');
      }
    };

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) / scale,
        y: (clientY - rect.top) / scale
      };
    }

    function startDrawing(e) {
      if (!activeTool || (e.touches && e.touches.length > 1)) return;
      isDrawing = true;
      const pos = getCanvasPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing || !activeTool || (e.touches && e.touches.length > 1)) return;
      e.preventDefault();
      const pos = getCanvasPos(e);

      ctx.lineTo(pos.x, pos.y);

      if (activeTool === 'draw') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 4 / scale;
      } else if (activeTool === 'erase') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 26 / scale;
      }

      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        saveCanvasToFirebase();
      }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    function saveCanvasToFirebase() {
      const dataUrl = canvas.toDataURL();
      set(drawingRef, dataUrl);
    }

    window.clearCanvas = function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      set(drawingRef, null);
    };

    onValue(drawingRef, (snapshot) => {
      const data = snapshot.val();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (data) {
        const img = new Image();
        img.src = data;
        img.onload = () => {
          ctx.globalCompositeOperation = 'source-over';
          ctx.drawImage(img, 0, 0);
        };
      }
    });

    // --- EMOJI RAIN ESPECIAL ---
    window.sendEmojiRain = function() {
      const emoji = prompt("Qual emoji você quer enviar?", "❤️");
      if (emoji && emoji.trim() !== "") {
        set(emojiRef, {
          emoji: emoji.trim(),
          timestamp: Date.now()
        });
      }
    };

    function triggerEmojiRain(emoji) {
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'emoji-rain';
          el.innerText = emoji;
          el.style.left = Math.random() * 92 + 'vw';
          el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
          document.body.appendChild(el);

          setTimeout(() => el.remove(), 4000);
        }, i * 100);
      }
    }

    let lastEmojiTime = 0;
    onValue(emojiRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.timestamp > lastEmojiTime) {
        lastEmojiTime = data.timestamp;
        if (isLoggedIn) {
          triggerEmojiRain(data.emoji);
        } else {
          pendingEmoji = data.emoji;
        }
      }
    });

    // --- ARRASTAR E REDIMENSIONAR DE ITENS COM COMPENSAÇÃO DE ZOOM ---
    function makeInteractive(element) {
      let posX = 0, posY = 0, initialX = 0, initialY = 0;

      const getPos = (e) => {
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      };

      const dragStart = (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON' || 
            e.target.tagName === 'AUDIO' || e.target.classList.contains('resize-handle')) return;

        const pos = getPos(e);
        initialX = pos.x;
        initialY = pos.y;

        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('touchend', dragEnd);
      };

      const dragMove = (e) => {
        const pos = getPos(e);
        posX = (initialX - pos.x) / scale;
        posY = (initialY - pos.y) / scale;
        initialX = pos.x;
        initialY = pos.y;

        element.style.top = (element.offsetTop - posY) + "px";
        element.style.left = (element.offsetLeft - posX) + "px";
      };

      const dragEnd = () => {
        document.removeEventListener('mousemove', dragMove);
        document.removeEventListener('mouseup', dragEnd);
        document.removeEventListener('touchmove', dragMove);
        document.removeEventListener('touchend', dragEnd);
        saveItemsToFirebase();
      };

      element.addEventListener('mousedown', dragStart);
      element.addEventListener('touchstart', dragStart, { passive: false });

      // Redimensionamento com ajuste de escala
      const resizeHandle = element.querySelector('.resize-handle');
      if (resizeHandle) {
        const resizeStart = (e) => {
          e.stopPropagation();
          const pos = getPos(e);
          let startW = element.offsetWidth;
          let startH = element.offsetHeight;
          let startX = pos.x;
          let startY = pos.y;

          const resizeMove = (e) => {
            const p = getPos(e);
            let newW = startW + (p.x - startX) / scale;
            let newH = startH + (p.y - startY) / scale;
            if (newW > 110) element.style.width = newW + 'px';
            if (newH > 70) element.style.height = newH + 'px';
          };

          const resizeEnd = () => {
            document.removeEventListener('mousemove', resizeMove);
            document.removeEventListener('mouseup', resizeEnd);
            document.removeEventListener('touchmove', resizeMove);
            document.removeEventListener('touchend', resizeEnd);
            saveItemsToFirebase();
          };

          document.addEventListener('mousemove', resizeMove);
          document.addEventListener('mouseup', resizeEnd);
          document.addEventListener('touchmove', resizeMove, { passive: false });
          document.addEventListener('touchend', resizeEnd);
        };

        resizeHandle.addEventListener('mousedown', resizeStart);
        resizeHandle.addEventListener('touchstart', resizeStart, { passive: false });
      }
    }

    function createBaseItem(type, id, x = 100, y = 100, w = 190, h = 130) {
      const item = document.createElement('div');
      item.className = `item ${type}`;
      item.dataset.id = id;
      item.style.left = x + 'px';
      item.style.top = y + 'px';
      item.style.width = w + 'px';
      item.style.height = h + 'px';

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.innerText = '✕';
      delBtn.onclick = () => {
        item.remove();
        saveItemsToFirebase();
      };
      item.appendChild(delBtn);

      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'resize-handle';
      item.appendChild(resizeHandle);

      makeInteractive(item);
      return item;
    }

    window.addNote = function(text = 'Escreva algo aqui...', id = Date.now().toString(), x = 120, y = 120, w = 190, h = 130) {
      if (document.querySelector(`[data-id="${id}"]`)) return;
      const item = createBaseItem('note', id, x, y, w, h);
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.oninput = saveItemsToFirebase;
      item.appendChild(textarea);
      board.appendChild(item);
      if (!isSyncingFromRemote) saveItemsToFirebase();
    };

    window.triggerFileInput = function(type) {
      activeFileType = type;
      fileInput.accept = type === 'image' ? 'image/*' : 'audio/*';
      fileInput.click();
    };

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const src = event.target.result;
        if (activeFileType === 'image') {
          addPhoto(src);
        } else if (activeFileType === 'audio') {
          addAudio(src);
        }
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    });

    function addPhoto(src, id = Date.now().toString(), x = 150, y = 150, w = 200, h = 160) {
      if (document.querySelector(`[data-id="${id}"]`)) return;
      const item = createBaseItem('photo', id, x, y, w, h);
      const img = document.createElement('img');
      img.src = src;
      item.appendChild(img);
      board.appendChild(item);
      if (!isSyncingFromRemote) saveItemsToFirebase();
    }

    function addAudio(src, id = Date.now().toString(), x = 160, y = 160, w = 220, h = 80) {
      if (document.querySelector(`[data-id="${id}"]`)) return;
      const item = createBaseItem('audio', id, x, y, w, h);
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = src;
      item.appendChild(audio);
      board.appendChild(item);
      if (!isSyncingFromRemote) saveItemsToFirebase();
    }

    // --- SINCRONIZAÇÃO DE ITENS NO FIREBASE ---
    function saveItemsToFirebase() {
      if (isSyncingFromRemote) return;

      const items = [];
      document.querySelectorAll('.item').forEach(el => {
        const type = el.classList.contains('note') ? 'note' :
                     el.classList.contains('photo') ? 'photo' : 'audio';

        const data = {
          id: el.dataset.id,
          type,
          x: parseInt(el.style.left),
          y: parseInt(el.style.top),
          w: parseInt(el.style.width),
          h: parseInt(el.style.height)
        };

        if (type === 'note') data.content = el.querySelector('textarea').value;
        if (type === 'photo') data.content = el.querySelector('img').src;
        if (type === 'audio') data.content = el.querySelector('audio').src;

        items.push(data);
      });

      set(itemsRef, items);
    }

    onValue(itemsRef, (snapshot) => {
      const items = snapshot.val() || [];
      isSyncingFromRemote = true;

      board.innerHTML = '';

      items.forEach(item => {
        if (item.type === 'note') addNote(item.content, item.id, item.x, item.y, item.w, item.h);
        if (item.type === 'photo') addPhoto(item.content, item.id, item.x, item.y, item.w, item.h);
        if (item.type === 'audio') addAudio(item.content, item.id, item.x, item.y, item.w, item.h);
      });

      isSyncingFromRemote = false;
    });
  </script>
</body>
</html>
